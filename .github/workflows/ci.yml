name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  skills-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/check-skills.py
      - run: python scripts/check-vendor.py
      - run: python scripts/check-plan.py docs/sdd/bootstrap/plan.json
      - run: python -m unittest discover -s tests -v
      - run: bash -n skills/layla-docker/assets/container/layla
      - name: Validate generated Docker Compose
        run: |
          python skills/layla-docker/scripts/setup.py --output runtime
          docker compose --project-directory runtime config --quiet
