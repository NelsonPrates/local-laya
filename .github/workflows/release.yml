name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/check-release.py "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check-skills.py
      - run: python scripts/check-vendor.py
      - run: python scripts/check-plan.py docs/sdd/bootstrap/plan.json
      - run: bash -n skills/layla-docker/assets/container/layla
      - name: Validate Compose
        run: |
          python skills/layla-docker/scripts/setup.py --output runtime
          docker compose --project-directory runtime config --quiet
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --output=local-laya-skills.tar.gz HEAD
          gh release create "$RELEASE_TAG" local-laya-skills.tar.gz --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
