name: local-laya
services:
  layla:
    build:
      context: .
      args:
        LAYLA_REV: ${LAYLA_REV:?Execute setup.py primeiro}
    image: local-laya:${LAYLA_REV}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${LAYLA_PORT:-8000}:8000"
    environment:
      HOME: /data
      LAYLA_DATA_DIR: /data
      PYTHONUNBUFFERED: "1"
      HF_HOME: /data/cache/huggingface
      MPLCONFIGDIR: /data/cache/matplotlib
    volumes:
      - ./data:/data
      - ./models:/data/models
      - ./workspace:/workspace
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    cpus: ${LAYLA_CPUS:-4}
    mem_limit: ${LAYLA_MEMORY:-8g}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
